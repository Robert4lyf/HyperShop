# run @Config(sdk = [34, 36]). See docs/decisions/000-template.md.
robolectric = "4.16.1"
ktlint = "12.1.2"
# HyperShop additions (Step 0.4), frozen.
okhttp = "4.12.0"
jsoup = "1.23.2"
serialization = "1.9.0"
work = "2.11.2"
kotest = "6.0.7"
junit5 = "5.13.4"
roborazzi = "1.76.0"
timber = "5.0.1"

