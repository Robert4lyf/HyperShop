navigationCompose = "2.8.4"
room = "2.7.1"
datastore = "1.1.1"
connectiq = "2.4.0"
coroutines = "1.9.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
turbine = "1.2.0"
