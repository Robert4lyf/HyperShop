# Memory caps sized for a 4-core cloud container (PLAN.md §2).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=3
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# From BangGym: KSP2 explicitly, so CI and Android Studio run the same processor.
ksp.useKSP2=true

# From BangGym: AGP 9 ships its own Kotlin support; this project uses the Kotlin
# Gradle plugin, so AGP's has to stand down or the two collide.
android.builtInKotlin=false
android.newDsl=false
