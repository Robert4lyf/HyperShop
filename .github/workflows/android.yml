name: Android

on:
  push:
    branches: [main, master]
  pull_request:
  # The repository has no long-lived integration branch yet, so this is the only
  # way to run the build on demand until one exists.
  workflow_dispatch:
    inputs:
      device_repeats:
        description: "Runs of the device scenarios, each on a fresh install (flakiness check)"
        required: false
        default: "1"

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      # The whole history: versionCode is the commit count, and a shallow
      # clone answers 1 for every build, so no debug APK could be told from
      # another by its badge.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 21, not 17: AGP 9 and Gradle 9 are only exercised on 21 here and in
      # Android Studio, whose bundled runtime is 21. The app still compiles to
      # JVM 17 bytecode — that is set in app/build.gradle.kts, not here.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      # One invocation rather than five: Gradle re-configures the whole build
      # on each, and the failure is identical either way.
      # tools/verify.sh is the same gate the agent runs locally: ktlint, every
      # unit test, assembleDebug and the repo checks (manifest, secrets scan,
      # golden checksum, protocol parity once both sides exist).
      # The watch compile is connectiq.yml's job; this one has no SDK cache.
      - name: Verify
        env:
          HYPERSHOP_SKIP_WATCH: '1'
        run: tools/verify.sh

      # Only when something failed, and kept for a day: artifacts count against
      # the account's 0.5 GB of Actions storage. The APK is not uploaded here;
      # release.yml publishes it as a release asset, which that quota excludes
      # (a ~60 MB APK per run filled it within a day of pushes).
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/*/build/reports/tests
          if-no-files-found: ignore
          retention-days: 1

  # The device scenarios (app/src/androidTest) on an emulator: the real
  # composables, SQLite and files. Non-blocking until it has passed on a run
  # of PRs (KNOWN_ISSUES #15); tools/verify.sh compiles them either way.
  device-tests:
    name: Device scenarios (emulator)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      # The hosted runner has KVM; the emulator needs it opened to the runner's user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the device scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          # A manual run can repeat the suite to look for flakiness; every repeat must pass.
          script: for i in $(seq 1 ${{ inputs.device_repeats || 1 }}); do echo "device run $i"; ./gradlew --max-workers=2 :app:connectedDebugAndroidTest || exit 1; done

      # The report is HTML in an artifact; the failures themselves belong in the log.
      - name: Show failing device tests
        if: failure()
        run: |
          for f in android/app/build/outputs/androidTest-results/connected/debug/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  print(f"::error::{case.get('classname')}.{case.get('name')}")
                  print((bad.text or bad.get("message") or "")[:3000])
          PY
          done

      - name: Upload the device report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 1
