name: Release APK

on:
  workflow_run:
    workflows: [Android, Connect IQ]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      android_run_id:
        description: Successful main-push Android run to promote (never rebuilds)
        required: true
        type: string

permissions:
  contents: write
  actions: read

# Never cancel a publication halfway through; recheck main immediately before promotion.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CIQ_SDK_VERSION: '9.2.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Locate the Android run for this exact commit
        id: run
        env:
          MANUAL_RUN: ${{ inputs.android_run_id }}
          CHECK_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$MANUAL_RUN" ]; then
            [[ "$MANUAL_RUN" =~ ^[0-9]+$ ]] || exit 1
            id="$MANUAL_RUN"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?head_sha=$CHECK_SHA&event=push&per_page=100" --jq '.workflow_runs | max_by(.id) | .id')
          fi
          [[ "$id" =~ ^[0-9]+$ ]] || exit 1
          sha=$(python3 tools/release/check_verified.py "$id")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-apk-${{ steps.run.outputs.sha }}
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: verified-apk
      - name: Prepare immutable build identity
        id: name
        run: |
          cp verified-apk/app-debug.apk hypershop-debug.apk
          build=$(git rev-list --count HEAD)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=build-$build-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check the secrets are set
        id: secrets
        env:
          KEY: ${{ secrets.CIQ_DEVELOPER_KEY }}
          TOKEN: ${{ secrets.GARMIN_TOKEN }}
          USER: ${{ secrets.GARMIN_USERNAME }}
          PASS: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          if [[ -n "$KEY" && ( -n "$TOKEN" || ( -n "$USER" && -n "$PASS" ) ) ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CIQ_DEVELOPER_KEY and a Garmin sign-in (GARMIN_TOKEN, or GARMIN_USERNAME and GARMIN_PASSWORD) are not all set; no watch package this time."
          fi


      - name: Set up JDK 21
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Connect IQ SDK
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/connectiq/sdk-${{ env.CIQ_SDK_VERSION }}
          key: connectiq-sdk-${{ env.CIQ_SDK_VERSION }}-${{ runner.os }}

      # Device definitions sit behind a Garmin sign-in (tools/garmin_devices.sh says
      # how it signs in). Cached by the manifest, so most builds never sign in at
      # all; the token or password is only needed when the cache is cold.
      - name: Cache the device definitions
        id: devices
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.Garmin/ConnectIQ/Devices
          key: connectiq-devices-${{ hashFiles('garmin/manifest.xml') }}

      - name: Check the saved Garmin sign-in
        if: steps.secrets.outputs.ready == 'true'
        env:
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
        run: ./tools/garmin_devices.sh --check

      - name: Download the device definitions
        if: steps.secrets.outputs.ready == 'true' && steps.devices.outputs.cache-hit != 'true'
        env:
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: ./tools/garmin_devices.sh

      # The your own key, never a generated one: the store accepts an
      # update only when it is signed like the first upload. Written outside
      # the workspace and removed by the runner with everything else.
      - name: Build the store package
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEY_B64: ${{ secrets.CIQ_DEVELOPER_KEY }}
        run: |
          key="$RUNNER_TEMP/developer_key.der"
          printf '%s' "$KEY_B64" | base64 -d > "$key"
          CIQ_DEVELOPER_KEY="$key" ./tools/package_watch.sh

      - name: Stage assets, then promote the complete release
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
          EXPECTED_SHA: ${{ steps.run.outputs.sha }}
          TAG: ${{ steps.name.outputs.tag }}
          WATCH_READY: ${{ steps.secrets.outputs.ready }}
        run: tools/release/publish.sh
